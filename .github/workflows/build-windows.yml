name: Build Windows

on:
  push:
    branches: ["setup/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build portable Windows application bundle
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Build onedir application
        shell: cmd
        run: build_exe.bat

      - name: Verify and package portable application
        shell: pwsh
        run: |
          $app = ".\dist\BarotraumaModManager"
          $exe = Join-Path $app "BarotraumaModManager.exe"
          $internal = Join-Path $app "_internal"
          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Application executable is missing: $exe"
          }
          if (!(Test-Path -LiteralPath $internal -PathType Container)) {
            throw "PyInstaller onedir runtime directory is missing: $internal"
          }
          $exeInfo = Get-Item -LiteralPath $exe
          if ($exeInfo.Length -lt 1MB) {
            throw "The executable is unexpectedly small ($($exeInfo.Length) bytes)."
          }
          $runtimeFiles = @(Get-ChildItem -LiteralPath $internal -Recurse -File)
          if ($runtimeFiles.Count -lt 1) {
            throw "The bundled runtime directory is empty."
          }
          New-Item -ItemType Directory -Force ".\release" | Out-Null
          Copy-Item -LiteralPath $app -Destination ".\release\BarotraumaModManager" -Recurse -Force
          Compress-Archive -Path ".\release\BarotraumaModManager" -DestinationPath ".\Barotrauma-Mod-Manager-Windows.zip" -Force
          $hash = (Get-FileHash ".\Barotrauma-Mod-Manager-Windows.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path ".\SHA256SUMS.txt" -Value "$hash  Barotrauma-Mod-Manager-Windows.zip" -Encoding ascii
          Write-Host "Bundled runtime files: $($runtimeFiles.Count)"
          Write-Host "Executable size: $($exeInfo.Length) bytes"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Barotrauma-Mod-Manager-Windows
          path: |
            Barotrauma-Mod-Manager-Windows.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Point v2.7.1 tag at the tested source commit
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force v2.7.1 "$env:GITHUB_SHA"
          git push --force origin refs/tags/v2.7.1

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          name: Barotrauma Mod Manager ${{ github.event_name == 'workflow_dispatch' && 'v2.7.1' || github.ref_name }}
          tag_name: ${{ github.event_name == 'workflow_dispatch' && 'v2.7.1' || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body: |
            Windows packaging update.

            - Replaced the self-extracting PyInstaller executable with a transparent onedir application bundle.
            - The ZIP contains the executable and its required runtime files; keep the extracted folder structure intact.
            - Russian and English interface selection is saved locally on this PC.
            - All manager features remain free; Boosty support is optional.

            Windows package: extract the ZIP, keep the complete BarotraumaModManager folder together, and run BarotraumaModManager.exe inside it.

            Support development: https://boosty.to/shiokaze/single-payment/donation/841459/target?share=target_link
          draft: false
          prerelease: false
          make_latest: true
          files: |
            Barotrauma-Mod-Manager-Windows.zip
            SHA256SUMS.txt
          overwrite_files: true
          fail_on_unmatched_files: true
          generate_release_notes: false
