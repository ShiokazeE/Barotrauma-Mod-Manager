name: Build Windows

on:
  push:
    branches: ["setup/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build portable Windows executable
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Build executable
        shell: cmd
        run: build_exe.bat

      - name: Package portable release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item .\BarotraumaModManager.exe .\release\BarotraumaModManager.exe -ErrorAction Stop
          $exe = Get-Item .\release\BarotraumaModManager.exe
          if ($exe.Length -lt 1MB) {
            throw "The packaged executable is unexpectedly small ($($exe.Length) bytes)."
          }
          Compress-Archive -Path .\release\BarotraumaModManager.exe -DestinationPath .\Barotrauma-Mod-Manager-Windows.zip -Force
          $hash = (Get-FileHash .\Barotrauma-Mod-Manager-Windows.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path .\SHA256SUMS.txt -Value "$hash  Barotrauma-Mod-Manager-Windows.zip" -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Barotrauma-Mod-Manager-Windows
          path: |
            Barotrauma-Mod-Manager-Windows.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          name: Barotrauma Mod Manager ${{ github.event_name == 'workflow_dispatch' && 'v2.7.1' || github.ref_name }}
          tag_name: ${{ github.event_name == 'workflow_dispatch' && 'v2.7.1' || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body: |
            Workshop scrolling, resize and bilingual interface update.

            - Fixed Workshop mouse-wheel handling and improved responsive resizing.
            - Added Russian and English interface selection on first launch, saved locally on this PC.
            - Added a header language switch and preserved existing mod profiles and Workshop names.
            - Added an optional Boosty donation link. The manager remains free to use.

            **Windows package:** portable Windows x64 ZIP. Extract it and run `BarotraumaModManager.exe`.

            Support development: https://boosty.to/shiokaze/single-payment/donation/841459/target?share=target_link
          draft: false
          prerelease: false
          make_latest: true
          files: |
            Barotrauma-Mod-Manager-Windows.zip
            SHA256SUMS.txt
          generate_release_notes: false
