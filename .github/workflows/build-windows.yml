name: Build Windows

on:
  push:
    branches: ["setup/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build portable Windows executable
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Build executable
        shell: cmd
        run: build_exe.bat

      - name: Package portable release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item .\BarotraumaModManager.exe .\release\BarotraumaModManager.exe -ErrorAction Stop
          $exe = Get-Item .\release\BarotraumaModManager.exe
          if ($exe.Length -lt 1MB) {
            throw "The packaged executable is unexpectedly small ($($exe.Length) bytes)."
          }
          Compress-Archive -Path .\release\BarotraumaModManager.exe -DestinationPath .\Barotrauma-Mod-Manager-Windows.zip -Force
          $hash = (Get-FileHash .\Barotrauma-Mod-Manager-Windows.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path .\SHA256SUMS.txt -Value "$hash  Barotrauma-Mod-Manager-Windows.zip" -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Barotrauma-Mod-Manager-Windows
          path: |
            Barotrauma-Mod-Manager-Windows.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Barotrauma-Mod-Manager-Windows.zip
            SHA256SUMS.txt
          generate_release_notes: true
