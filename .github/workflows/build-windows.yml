name: Build Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build executable
        run: ./build_exe.bat
      - name: Package portable release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/BarotraumaModManager/BarotraumaModManager.exe release/ -ErrorAction SilentlyContinue
          if (-not (Test-Path release/BarotraumaModManager.exe)) {
            Copy-Item BarotraumaModManager.exe release/ -ErrorAction Stop
          }
          Compress-Archive -Path release/BarotraumaModManager.exe -DestinationPath Barotrauma-Mod-Manager-Windows.zip -Force
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Barotrauma-Mod-Manager-Windows.zip
          generate_release_notes: true
